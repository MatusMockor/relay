  fl: 'Zvyšok počká: faktúru po splatnosti pre Ateliér Brezina pripomenie Faktúrka.',
};
const TASK_TITLES = {
  'c-stage': ['Účet na stage pre Samuela Vargu', 'termín piatok'],
  'c-mr412': ['Review MR !412 (PaymentGateway)', 'termín dnes'],
  'c-q1': ['Odhady Q1 pre Partner API', 'termín piatok'],
  'c-vacation': ['Zapísať dovolenku do tabuľky', 'termín 30. 11.'],
  'c-retro': ['Pripraviť body na retro', 'termín pondelok'],
  'c-lunch': ['Potvrdiť Tomášovi piatkový obed', 'termín zajtra'],
  'os-voda': ['Nahlásiť stav vodomerov', 'termín 25. 11.'],
  'os-dar': ['Darček pre ocka: poslať Katke 90 €', 'termín piatok'],
  'fl-ponuka': ['Cenová ponuka pre Kaviareň Zrnko', 'termín pondelok'],
  'fl-dph': ['Podklady k DPH za október', 'termín 25. 11.'],
};
const STOP = ['ktor', 'mail', 'mam', 'som', 'pre', 'ako', 'cez', 'ale', 'alebo', 'kde', 'kedy', 'preco', 'najdi', 'hladaj', 'zhrn', 'vsetk', 'sprav', 'mne', 'nieco', 'tom', 'tej', 'tie'];

const Brain = {
  plan(q, ctx) {
    const n = fold(q);
    if (!S.settings.ai) return this.offline();
    const key = (n.match(/\b[a-z]{3}-\d{2,3}\b/) || [])[0];
    const who = (PERSON_RX.find(([, r]) => r.test(n)) || [])[0];
    if (/odpoved|odpis|reply|napis .*(mail|spravu)/.test(n)) return this.reply(who, ctx);
    if (/task|ulohu|uloha|todo|vytvor/.test(n)) return this.task(ctx);
    if (key) return this.issue(key.toUpperCase());
    if (/zhrn|o com je|sumar|vlakno|vlakna/.test(n) && ctx && ctx.msgs.length) return this.summarize(ctx);
    if (/dnes|vybav|urobit|spravit|priorit|cak|co mam/.test(n)) return this.today();
    if (who) return this.about(who);
    return this.search(q);
  },
  offline() {
    return {
      steps: ['Pripája sa na domaci-server…'],
      answer: () => ({
        html: `<div class="ans"><p>AI worker na domaci-server je teraz offline, takže nemám kde spustiť ${RUNNERS[S.settings.runner]}. Keď ho zapneš, odpoviem.</p><div class="refs"><button class="btn" data-act="ask-primary">Otvoriť nastavenia AI ${kbd('↵')}</button></div></div>`,
        primary: () => { Ask.close(); Settings.open('ai'); },
      }),
    };
  },
  today() {
    const imp = CONVS.filter(c => inFolder(c, 'imp')).length;
    const tasks = CONVS.filter(c => inFolder(c, 'tasks')).length;
    const scope = unified() ? ` naprieč ${ACCOUNTS.length} účtami` : multi() ? ` účtu ${ACC(S.acct).name}` : '';
    const steps = [`Číta ${imp} ${plural(imp, 'mail', 'maily', 'mailov')} v Dôležitých${scope}…`];
    if (tasks) steps.push(`Prechádza ${tasks} ${plural(tasks, 'úlohu', 'úlohy', 'úloh')}…`, 'Načítava termíny z Jiry cez Atlassian MCP…');
    steps.push('Zoraďuje podľa naliehavosti…');
    return {
      steps,
      answer: () => {
        const all = Object.values(TODAY_POOL).flat();
        const pool = S.acct === 'all' ? TODAY_ALL.map(id => all.find(x => x[0] === id)) : TODAY_POOL[S.acct] || [];
        let open = pool.filter(([id]) => C(id) && C(id).status === 'inbox' && inAcct(C(id)));
        if (!open.length) open = CONVS.filter(c => inFolder(c, 'imp') && c.unread && !P(c.from).bot).slice(0, 5).map(c => [c.id, sideText(c)]);
        if (!open.length) return { html: '<div class="ans"><p>Dnes už nič podstatné nečaká. Všetko z Dôležitých a Úloh máš vybavené.</p></div>' };
        const meta = TODAY_META[S.acct] || '';
        return {
          html: `<div class="ans"><p>Dnes na teba ${plural(open.length, 'čaká', 'čakajú', 'čaká')} ${open.length} ${plural(open.length, 'vec', 'veci', 'vecí')}${unified() ? ` v ${new Set(open.map(([id]) => C(id).acct)).size} účtoch` : ''}, od najnaliehavejšej:</p><ol>${open.map(([id, t]) => `<li>${accTag(C(id))}${esc(t)} ${refHTML(C(id))}</li>`).join('')}</ol>${meta ? `<p class="meta">${esc(meta)}</p>` : ''}</div>`,
          primary: () => { Ask.close(); openConv(open[0][0]); },
        };
      },
    };
  },
  issue(key) {
    const is = ISSUES[key];
    if (!is) return { steps: [`Hľadá ${key} v pošte…`, `Načítava ${key} z Jiry…`], answer: () => ({ html: `<div class="ans"><p>${esc(key)} som v Jire ani v pošte nenašiel.</p></div>` }) };
    const rel = CONVS.filter(c => c.key === key);
    const task = rel.find(c => c.split === 'tasks') || rel[0];
    const events = rel.reduce((n, c) => n + c.msgs.length, 0);
    return {
      steps: [`Hľadá ${key} v pošte… ${rel.length} ${plural(rel.length, 'mail', 'maily', 'mailov')}`, `Načítava ${key} z Jiry cez Atlassian MCP…`, `Číta ${events} ${plural(events, 'udalosť', 'udalosti', 'udalostí')} a komentáre…`],
      answer: () => ({
        html: `<div class="ans"><p><span class="key">${key}</span> <b>${esc(is.title)}</b></p><p>${esc(is.text)}</p><p>${esc(is.next)}</p><p class="meta">Stav ${esc(is.status)} · Priorita ${esc(is.prio)}</p><div class="refs">${rel.slice(0, 4).map(c => `<button class="ref" data-open="${c.id}">${esc(FOLDERS[c.split].label)}: ${esc(truncate(c.subj, 28))}</button>`).join('')}</div></div>`,
        primary: task ? () => { Ask.close(); openConv(task.id); } : null,
      }),
    };
  },
  reply(who, ctx) {
    const pick = f => CONVS.find(c => c.from === who && c.status === 'inbox' && c.sugs && aiReplies(c) && f(c));
    const ctxOk = ctx && ctx.sugs && aiReplies(ctx) && !P(ctx.from).bot && ['inbox', 'snoozed'].includes(ctx.status);
    const target = who ? (ctxOk && ctx.from === who ? ctx : pick(c => c.split === 'imp') || pick(() => true)) : ctxOk ? ctx : null;
    if (!target) {
      const msg = who ? `${P(who).name} od teba teraz nič nepotrebuje.` : 'Neviem, komu mám odpovedať. Otvor mail, alebo skús napríklad „Priprav odpoveď Lucii“.';
      return { steps: ['Hľadá konverzáciu…'], answer: () => ({ html: `<div class="ans"><p>${esc(msg)}</p></div>` }) };
    }
    const p = P(target.from);
    const draft = target.sugs[0][1];
    return {
      steps: [`Číta vlákno „${truncate(target.subj, 44)}“`, target.key ? `Načítava ${target.key} z Jiry…` : `Pozerá tvoje predchádzajúce odpovede ${p.dat}…`, 'Píše návrh odpovede…'],
      answer: () => ({
        html: `<div class="ans"><p>Návrh odpovede ${esc(p.dat)} na „${esc(target.subj)}“${multi() ? `, odošle sa z ${esc(ACC(target.acct).email)}` : ''}:</p><div class="card"><div class="ct"><b>Koncept odpovede</b><span>${esc(p.name)}</span></div><div class="draft">${esc(draft)}</div><div class="btns"><button class="btn pri" data-act="ask-primary">Vložiť do odpovede ${kbd('↵')}</button>${refHTML(target)}</div></div></div>`,
        primary: () => { Ask.close(); startReply(target.id, draft); },
      }),
    };
  },
  task(ctx) {
    if (!ctx) return { steps: ['Hľadá vybraný mail…'], answer: () => ({ html: '<div class="ans"><p>Najprv vyber mail, z ktorého mám spraviť úlohu.</p></div>' }) };
    if (ctx.split === 'tasks') return { steps: [`Číta „${truncate(ctx.subj, 34)}“…`], answer: () => ({ html: `<div class="ans"><p>Toto už je úloha${ctx.key ? ` v Jire (${ctx.key})` : ''}. Nájdeš ju v Úlohách.</p><div class="refs">${refHTML(ctx)}</div></div>` }) };
    return {
      steps: [`Číta mail „${truncate(ctx.subj, 34)}“…`, 'Hľadá termín a čo presne treba spraviť…', 'Vytvára úlohu v Úlohách…'],
      answer: () => {
        const t = this.makeTask(ctx);
        return {
          html: `<div class="ans"><p>Hotovo, úloha je v Úlohách.</p><div class="card"><div class="task"><span class="box"></span><div>${esc(t.subj)}<small>${esc(cap(t.state[0]))} · z mailu od ${esc(P(ctx.from).name)}</small></div></div></div><div class="refs">${refHTML(t)}</div></div>`,
          primary: () => { Ask.close(); openConv(t.id); },
        };
      },
    };
  },
  makeTask(ctx) {
    const id = 'ai-' + ctx.id;
    if (C(id)) return C(id);
    const [subj, due] = TASK_TITLES[ctx.id] || [titleOf(ctx), 'bez termínu'];
    const t = prep({ id, acct: ctx.acct, split: 'tasks', from: ctx.from, unread: true, day: 'Dnes', time: '9:41', state: [due, 'acc'], subj, ai: `Z mailu „${truncate(ctx.subj, 40)}“`, side: ctx.side, sum: ctx.sum ? { ...ctx.sum } : { p: sideText(ctx) }, msgs: ctx.msgs.slice(), sugs: ctx.sugs, fresh: true });
    const at0 = CONVS.findIndex(c => c.split === 'tasks');
    CONVS.splice(at0 < 0 ? 0 : at0, 0, t);
    setTimeout(() => { t.fresh = false; }, 3200);
    render();
    return t;
  },
  summarize(ctx) {
    const s = ctx.sum || { p: sideText(ctx) };
    const n = ctx.msgs.length;
    const isJira = ctx.msgs.some(m => m.j);
    return {
      steps: [`Číta vlákno „${truncate(ctx.subj, 40)}“…`, ctx.key ? `Načítava ${ctx.key} z Jiry cez Atlassian MCP…` : `Prechádza ${n} ${isJira ? plural(n, 'udalosť', 'udalosti', 'udalostí') : plural(n, 'mail', 'maily', 'mailov')}…`, 'Píše zhrnutie…'],
      answer: () => ({
        html: `<div class="ans"><p>${esc(s.p)}</p>${s.list ? `<p class="meta">Čo treba spraviť:</p><ol>${s.list.map(t => `<li>${esc(t)}</li>`).join('')}</ol>` : ''}<div class="refs">${refHTML(ctx)}</div></div>`,
        primary: () => { Ask.close(); openConv(ctx.id); },
      }),
    };
  },
  about(who) {
    const p = P(who);
    const list = CONVS.filter(c => c.from === who && c.status === 'inbox' && c.split !== 'jira');
    return {
      steps: [`Hľadá maily od ${p.name}…`, `Číta ${list.length} ${plural(list.length, 'konverzáciu', 'konverzácie', 'konverzácií')}…`],
      answer: () => ({
        html: list.length
          ? `<div class="ans"><p>${esc(p.name)} (${esc(p.role)}) má s tebou otvorené${multi() && list[0] ? ` v účte ${esc(ACC(list[0].acct).name)}` : ''}:</p><ol>${list.map(c => `<li>${esc(sideText(c))} ${refHTML(c)}</li>`).join('')}</ol></div>`
          : `<div class="ans"><p>${esc(p.name)} teraz s tebou nemá nič otvorené.</p></div>`,
        primary: list.length ? () => { Ask.close(); openConv(list[0].id); } : null,
      }),
    };
  },
  search(q) {
    const words = fold(q).split(/[^a-z0-9!-]+/).filter(w => w.length >= 3 && !STOP.some(s => w.startsWith(s)));
    const stem = w => w.slice(0, Math.max(4, w.length - 2));
    const pool = CONVS.filter(c => inAcct(c) && c.status !== 'discarded');
    const hits = pool.map(c => ({ c, s: words.filter(w => searchText(c).includes(stem(w))).length })).filter(x => x.s).sort((a, b) => b.s - a.s).slice(0, 5).map(x => x.c);
    return {
      steps: [`Prehľadáva ${pool.length} konverzácií${unified() ? ` v ${ACCOUNTS.length} účtoch` : multi() ? ` v účte ${ACC(S.acct).name}` : ''}…`, hits.length ? `Číta ${hits.length} ${plural(hits.length, 'najrelevantnejšiu', 'najrelevantnejšie', 'najrelevantnejších')}…` : 'Skúša aj Jiru…'],
      answer: () => ({
        html: hits.length
          ? `<div class="ans"><p>Našiel som ${hits.length} ${plural(hits.length, 'konverzáciu', 'konverzácie', 'konverzácií')}:</p><ol>${hits.map(c => `<li>${accTag(c)}${esc(sideText(c))} ${refHTML(c)}</li>`).join('')}</ol></div>`
          : `<div class="ans"><p>Na „${esc(q)}“ som v pošte nič nenašiel. Skús napríklad „Čo mám dnes vybaviť?“ alebo „Zhrň API-77“.</p></div>`,
        primary: hits.length ? () => { Ask.close(); openConv(hits[0].id); } : null,
      }),
    };
  },
};

const Ask = {
  o: null, phase: 'idle', sel: -1, timers: [], primary: null, ctx: null, lastQ: '',
  get examples() { return [...(CHAT_EX[unified() ? 'all' : S.acct] || CHAT_EX.efa), 'Vytvor task z tohto mailu']; },
  open(prefill = '') {
    if (this.o) return;
    const ctx = current();
    this.ctx = ctx ? ctx.id : null;
    const el = Layer.make('', `<div class="pal ask" role="dialog" aria-label="Spýtať sa AI"><div class="pal-in">${SPARK}<input id="ask-q" placeholder="Spýtaj sa na poštu alebo zadaj úlohu…" autocomplete="off" spellcheck="false" aria-label="Otázka pre AI"></div><div class="ask-meta"><span class="ctx">${ctxLabel(ctx)}</span><span class="runner" id="ask-runner"></span></div><div class="pal-body" id="ask-body"></div></div>`);
    this.o = { el, key: e => this.key(e), close: () => this.close() };
    Layer.push(this.o);
    this.phase = 'idle';
    this.sel = -1;
    this.renderRunner();
    this.renderIdle();
    const inp = $('#ask-q');
    inp.value = prefill;
    inp.addEventListener('input', () => { if (this.phase !== 'run' && !inp.value.trim()) this.reset(); });
    el.addEventListener('mousemove', e => {
      const b = e.target.closest('[data-act="ask-ex"]');
      if (b && +b.dataset.pi !== this.sel) { this.sel = +b.dataset.pi; this.markEx(); }
    });
    inp.focus();
  },
  renderRunner() {
    const r = S.settings.runner;
    $('#ask-runner').innerHTML = Object.entries(RUNNERS).map(([k, l]) => `<button class="${k === r ? 'on' : ''}" data-act="runner" data-v="${k}" data-tip="Spustiť cez ${l}" data-kbd="Tab">${l}</button>`).join('<span class="dt">·</span>');
  },
  renderIdle() {
    $('#ask-body').innerHTML = `<div class="grp">Skús napríklad</div>${this.examples.map((x, i) => `<button class="pi" data-act="ask-ex" data-pi="${i}"><span class="ic">${SPARK}</span><span class="lb">${esc(x)}</span></button>`).join('')}`;
    this.markEx();
  },
  markEx() { $$('#ask-body [data-act="ask-ex"]').forEach(b => b.classList.toggle('on', +b.dataset.pi === this.sel)); },
  reset() {
    this.clear();
    this.phase = 'idle';
    this.sel = -1;
    this.renderIdle();
  },
  later(ms, fn) { this.timers.push(setTimeout(() => { if (this.o) fn(); }, ms)); },
  clear() {
    this.timers.forEach(clearTimeout);
    this.timers = [];
    this.primary = null;
  },
  submit(q) {
    const inp = $('#ask-q');
    inp.value = q;
    this.lastQ = q;
    this.clear();
    this.phase = 'run';
    const plan = Brain.plan(q, C(this.ctx));
    $('#ask-body').innerHTML = '<div class="ask-out"><div class="steps" id="ask-steps"></div><div id="ask-ans"></div></div>';
    const started = performance.now();
    let t = 120;
    plan.steps.forEach(s => {
      this.later(t, () => {
        $$('#ask-steps .run').forEach(d => d.classList.remove('run'));
        $('#ask-steps').insertAdjacentHTML('beforeend', `<div class="run">${esc(s)}</div>`);
      });
      t += 480 + Math.round(Math.random() * 260);
    });
    this.later(t, () => {
      $$('#ask-steps .run').forEach(d => d.classList.remove('run'));
      const a = plan.answer();
      const secs = ((performance.now() - started) / 1000).toFixed(1).replace('.', ',');
      $('#ask-ans').innerHTML = `${a.html}<div class="ans-foot" style="margin-top:14px">${RUNNERS[S.settings.runner]} · domaci-server · ${secs} s</div>`;
      this.primary = a.primary || null;
      this.phase = 'done';
    });
  },
  key(e) {
    const inp = $('#ask-q');
    const v = inp.value.trim();
    if (e.key === 'Escape') { e.preventDefault(); this.close(); return; }
    if (e.key === 'Tab') { e.preventDefault(); S.settings.runner = S.settings.runner === 'claude' ? 'codex' : 'claude'; this.renderRunner(); return; }
    if (this.phase === 'idle' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault();
      const n = this.examples.length;
      this.sel = e.key === 'ArrowDown' ? (this.sel + 1) % n : (this.sel - 1 + n) % n;
      this.markEx();
      return;
    }
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (this.phase === 'done' && v === this.lastQ && this.primary) { this.primary(); return; }
    if (this.phase === 'run') return;
    const q = v || (this.sel >= 0 ? this.examples[this.sel] : '');
    if (q) this.submit(q);
  },
  close() {
    if (!this.o) return;
    this.clear();
    Layer.remove(this.o);
    this.o = null;
  },
};

/* ===== settings ===== */
const sw = (k, on, label) => `<button class="sw${on ? ' on' : ''}" data-act="set-sw" data-k="${k}" role="switch" aria-checked="${on}" aria-label="${esc(label)}"></button>`;
const seg = (act, opts, cur) => `<div class="seg">${opts.map(([v, l]) => `<button class="${v === cur ? 'on' : ''}" data-act="${act}" data-v="${v}">${l}</button>`).join('')}</div>`;
const srow = (b, span, r) => `<div class="srow"><div class="l"><b>${b}</b>${span ? `<span>${span}</span>` : ''}</div><div class="r">${r}</div></div>`;
const stat = (on, label, cls = '') => `<span class="stat ${on ? '' : 'off'} ${cls}"><i></i>${label}</span>`;

const SYNC_OPTS = [['1', '1 min'], ['5', '5 min'], ['15', '15 min'], ['30', '30 min'], ['manual', 'Ručne']];
const PROVIDERS = { gmail: ['Gmail', 'imap.gmail.com', 'meno@gmail.com'], outlook: ['Outlook', 'outlook.office365.com', 'meno@outlook.com'], imap: ['IMAP', '', 'meno@firma.sk'] };
const Settings = {
  o: null, sec: 'accounts', adding: null, timers: [],
  SECS: [['accounts', 'Účty'], ['sync', 'Synchronizácia'], ['notif', 'Notifikácie'], ['ai', 'AI worker'], ['rules', 'Split Inbox'], ['look', 'Vzhľad'], ['keys', 'Klávesové skratky']],
  open(sec) {
    if (sec) this.sec = sec;
    if (this.o) { this.refresh(); return; }
    const el = Layer.make('mid', '<div class="sheet" role="dialog" aria-label="Nastavenia" id="sheet"></div>');
    this.o = { el, key: e => this.key(e), close: () => this.close() };
    Layer.push(this.o);
    this.refresh();
  },
  close() {
    if (!this.o) return;
    Layer.remove(this.o);
    this.o = null;
    if (this.adding && this.adding.phase !== 'connecting') this.adding = null;
  },
  key(e) {
    const mod = e.metaKey || e.ctrlKey;
    if (e.key === 'Escape' && !mod && this.adding && this.adding.phase === 'form' && this.sec === 'accounts') { e.preventDefault(); this.adding = null; this.refresh(); return; }
    if (e.key === 'Escape' || (mod && e.key === ',')) { e.preventDefault(); this.close(); return; }
    if (Keys.typing(e.target)) {
      if (e.key === 'Enter' && this.adding) { e.preventDefault(); this.connect(); }
      return;
    }
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp' && e.key !== 'j' && e.key !== 'k') return;
    e.preventDefault();
    const i = this.SECS.findIndex(s => s[0] === this.sec);
    const d = e.key === 'ArrowDown' || e.key === 'j' ? 1 : -1;
    this.sec = this.SECS[(i + d + this.SECS.length) % this.SECS.length][0];
    this.refresh();
  },
  refresh() {
    if (!this.o) return;
    const nav = this.SECS.map(([k, l]) => `<button class="${k === this.sec ? 'on' : ''}" data-act="set-sec" data-v="${k}">${l}${k === 'ai' ? stat(S.settings.ai, '') : ''}</button>`).join('');
    $('#sheet').innerHTML = `<nav class="sh-nav"><h3>Nastavenia</h3>${nav}<span class="proto">Prototyp - ukážkové dáta</span></nav><div class="sh-main">${this[this.sec]()}</div>`;
  },
  accounts() {
    if (this.adding) return this.addHTML();
    const syncing = S.settings.syncing;
    const cards = ACCOUNTS.map(a => {
      const tg = (k, l, tip) => `<button class="tg${a.ai[k] ? ' on' : ''}" data-act="acc-ai" data-a="${a.id}" data-k="${k}" aria-pressed="${a.ai[k]}" data-tip="${esc(tip)}"><i></i>${l}</button>`;
      const int = `<div class="seg">${SYNC_OPTS.map(([v, l]) => `<button class="${v === a.interval ? 'on' : ''}" data-act="acc-int" data-a="${a.id}" data-v="${v}">${l}</button>`).join('')}</div>`;
      const prim = `<button class="sw${a.primary ? ' on' : ''}" data-act="acc-primary" data-a="${a.id}" role="switch" aria-checked="${a.primary}" aria-label="Hlavný účet ${esc(a.name)}"></button>`;

/* ===== tooltip ===== */
const Tip = {
  t: 0, cur: null,
  init() {
    document.addEventListener('mouseover', e => {
      const a = e.target.closest('[data-tip]');
      if (a === this.cur) return;
      this.hide();
      if (!a) return;
      this.cur = a;
      this.t = setTimeout(() => this.show(a), a.dataset.long ? 650 : 420);
    });
    document.addEventListener('mousedown', () => this.hide(), true);
    document.addEventListener('scroll', () => this.hide(), true);
  },
  show(a) {
    if (!a.isConnected) return;
    const tip = $('#tip');
    tip.className = 'tip' + (a.dataset.long ? ' long' : '');
    tip.innerHTML = `<span>${esc(a.dataset.tip)}</span>${a.dataset.kbd ? kbds(a.dataset.kbd.split(' ')) : ''}`;
    tip.hidden = false;
    const r = a.getBoundingClientRect();
    const w = tip.offsetWidth;
    const h = tip.offsetHeight;
    const x = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2));
    const y = r.bottom + 8 + h > innerHeight - 8 ? r.top - h - 8 : r.bottom + 8;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  },
  hide() {
    clearTimeout(this.t);
    this.cur = null;
    $('#tip').hidden = true;
  },
};

      toast(`Nový mail v ${c.split === 'imp' ? 'Dôležitých' : FOLDERS[c.split].label}${multi() ? ` (${ACC(c.acct).name})` : ''}: ${P(c.from).name}`);

    1: () => pickSug(0), 2: () => pickSug(1), 3: () => pickSug(2),
  },
  onKey(e) {
    Tip.hide();
    const top = Layer.top();
    if (top) { top.key(e); return; }
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); Palette.open(); return; }
    if (mod && e.key === ',') { e.preventDefault(); Settings.open(); return; }
    if (e.altKey && !mod && /^Digit[123]$/.test(e.code)) { e.preventDefault(); openRight(TABS[+e.code.slice(5) - 1][0]); return; }
    if (mod && !e.altKey && !e.shiftKey && /^Digit[1-9]$/.test(e.code)) {
      const ids = ['all', ...ACCOUNTS.map(a => a.id)];
      const id = ids[+e.code.slice(5) - 1];
      if (id) { e.preventDefault(); selectAccount(id, true); }
      return;
    }
    const t = e.target;
    if (t.classList && t.classList.contains('rz') && Resize.key(e)) return;
    if (t.id === 'cmp-t') { composerKey(e); return; }
    if (t.id === 'cmp-ai') { aiKey(e); return; }
    if (t.id === 'q') { Search.key(e); return; }
    if (t.id === 'chat-q') { Chat.key(e); return; }
    if (this.typing(t) || mod || e.altKey) return;
    if ((e.key === 'Enter' || e.key === ' ') && t.tagName === 'BUTTON') return;
    if (this.g && Date.now() - this.g < 1500) {
      this.g = 0;
      const f = G_KEYS[e.key.toLowerCase()];
      if (f) { e.preventDefault(); selectFolder(f); }
      return;
    }
    this.g = 0;
    const fn = this.map[e.key] || (e.key.length === 1 ? this.map[e.key.toLowerCase()] : null);
    if (!fn) return;
    e.preventDefault();
    fn(e);
  },
};

/* ===== clicks ===== */
const ACT = {
  folder: a => selectFolder(a.dataset.f),
  search: () => Search.open(),
  ask: () => Chat.focus(),
  settings: () => Settings.open(),
  'settings-ai': () => Settings.open('ai'),
  back: () => back(),
  prev: () => stepThread(-1),
  next: () => stepThread(1),
  done: a => markDone(a.dataset.id),
  remind: a => Remind.openFor(a.dataset.id, a),
  reply: a => startReply(a.dataset.id),
  trash: a => trashConv(a.dataset.id),
  'sched-now': a => sendScheduledNow(a.dataset.id),
  'sched-edit': () => { const c = current(); if (c) editScheduled(c); },
  undo: () => undo(),
  expand: a => { S.expanded.add(S.open + ':' + a.dataset.i); renderThread(); },
  collapse: a => { S.expanded.delete(S.open + ':' + a.dataset.i); renderThread(); },
  check: a => { const c = C(S.open); c.checked[a.dataset.i] = !c.checked[a.dataset.i]; renderThread(); },
  sug: a => pickSug(+a.dataset.i),
  'ai-edit': () => toggleAiBar(),
  'ai-chip': a => applyRewrite(a.dataset.v),
  draft: () => saveDraft(),
  send: () => confirmSend(),
  'cf-yes': () => Confirm.cur && Confirm.cur.yes(),
  'cf-no': () => Confirm.cur && Confirm.cur.no(),
  'pal-run': a => Palette.run(Palette.items[+a.dataset.pi]),
  'rem-pick': a => WhenPick.pick(WhenPick.list[+a.dataset.pi].date),
  'ask-ex': a => Ask.submit(Ask.examples[+a.dataset.pi]),
  'ask-primary': () => Ask.primary && Ask.primary(),
  runner: a => { S.settings.runner = a.dataset.v; if (Ask.o) Ask.renderRunner(); Chat.renderCtx(); },
  'toggle-left': () => toggleLeft(),
  'toggle-right': () => toggleRight(),
  tab: a => openRight(a.dataset.v),
  compose: () => Compose.open(),
  'compose-to': a => Compose.open({ to: a.dataset.v }),
  'ask-about': a => Chat.ask(`Čo odo mňa chce ${P(a.dataset.v).name}?`),
  'chat-ex': a => Chat.submit(a.dataset.v),
  'chat-primary': a => { const it = Chat.items[+a.dataset.n]; if (it && it.primary) it.primary(); },
  'cal-day': a => { S.calDay = +a.dataset.v; openRight('cal'); $('#pane-cal').scrollTop = 0; },
  propose: () => proposeTime(),
  'nm-close': () => Compose.close(true),
  'nm-unto': () => { Compose.k.to = null; Compose.suggest(); Compose.render('nm-to'); },
  'nm-pick': a => Compose.pick(+a.dataset.pi),
  'nm-ai': () => Compose.toggleAi(),
  'nm-chip': a => Compose.generate(a.dataset.v),
  'nm-sched': () => Compose.schedule(),
  'nm-send': () => Compose.confirmSend(),
  'set-sec': a => { Settings.sec = a.dataset.v; Settings.refresh(); },
  'set-int': a => { S.settings.interval = a.dataset.v; Settings.refresh(); },
  'set-runner': a => { S.settings.runner = a.dataset.v; Settings.refresh(); Chat.renderCtx(); },
  'set-density': a => setDensity(a.dataset.v),
  'set-tab': a => { openRight(a.dataset.v); Settings.refresh(); },
  'open-keys': () => { Settings.close(); Shortcuts.open(); },
  'set-sw': a => {
    const k = a.dataset.k;
    if (k === 'ai') { AIWorker.set(!S.settings.ai); return; }
    if (k === 'left') { toggleLeft(); return; }
    if (k === 'right') { toggleRight(); return; }
    S.settings[k] = !S.settings[k];
    Settings.refresh();
  },
  'sync-now': () => Sync.check(),
  'acct-menu': a => AcctMenu.open({ anchor: a, cur: S.acct, src: 'fold', onPick: id => { if (id === 'add') { Settings.openAdd(); return; } selectAccount(id); }, onClose: () => $('#acct-btn')?.focus() }),
  'acm-pick': a => AcctMenu.pick(+a.dataset.pi),
  acct: a => selectAccount(a.dataset.v),
  'nm-from': a => {
    if (!Compose.k) return;
    AcctMenu.open({ anchor: a, cur: Compose.k.acct, all: false, manage: false, src: 'nm', onPick: id => { Compose.k.acct = id; Compose.render('nm-from'); }, onClose: () => Compose.focus('nm-from') });
  },
  'cmp-from': a => {
    const k = S.compose;
    if (!k || k.busy) return;
    AcctMenu.open({ anchor: a, cur: k.acct, all: false, manage: false, src: 'cmp', onPick: id => { if (S.compose === k) { k.acct = id; renderThread(); focusComposer(); } }, onClose: () => focusComposer() });
  },
  'acc-int': a => { ACC(a.dataset.a).interval = a.dataset.v; Settings.refresh(); },
  'acc-primary': a => Accounts.setPrimary(a.dataset.a),
  'acc-ai': a => { const x = ACC(a.dataset.a); x.ai[a.dataset.k] = !x.ai[a.dataset.k]; Settings.refresh(); render(); },
  'acc-remove': a => Accounts.confirmRemove(a.dataset.a),
  'acc-add': () => { Settings.openAdd(); },
  'acc-prov': a => { const f = Settings.adding; if (!f) return; f.provider = a.dataset.v; f.err = ''; if (f.provider === 'imap' && !f.port) f.port = '993'; Settings.refresh(); Settings.focusAdd(); },
  'acc-connect': () => Settings.connect(),
  'acc-cancel': () => { Settings.adding = null; Settings.refresh(); },
  'acc-go': a => { Settings.adding = null; Settings.close(); selectAccount(a.dataset.a); },
  'rz-reset': () => Resize.resetAll(),
};
function onClick(e) {
  const a = e.target.closest('[data-act]');
  if (a && ACT[a.dataset.act]) { Tip.hide(); ACT[a.dataset.act](a, e); return; }
  const o = e.target.closest('[data-open]');
  if (o) { Layer.closeAll(); openConv(o.dataset.open); return; }
  const row = e.target.closest('[data-row]');
  if (row && !S.busy) openConv(row.dataset.row);
}

/* ===== boot ===== */
function hydrate() {
  CONVS.forEach(c => {
    if (typeof c.sugs === 'string') c.sugs = (C(c.sugs) || {}).sugs || null;
    if (c.snoozeAt) { const d = at(...c.snoozeAt); c.snooze = { date: d, ...describeWhen(d) }; }
    if (c.schedAt) {
      const d = at(...c.schedAt);
      const w = describeWhen(d);
      c.sched = { date: d, ...w };
      c.schedText = flat(c.nm.text);
      c.msgs = [{ f: 'me', t: w.short, b: c.nm.text.split(/\n+/).map(x => x.trim()).filter(Boolean) }];
    }
  });
}
function onResize() {
  const wide = innerWidth >= autoBreak();
  if (wide !== Keys.wide && !wide && S.leftUser === true) S.leftUser = null;
  Keys.wide = wide;
  renderFold();
  Resize.apply();
  if (AcctMenu.o) AcctMenu.close(false);
}
function boot() {
  hydrate();
  loadPersisted();
  normalizeFolder();
  Keys.wide = innerWidth >= autoBreak();
  Resize.init();
  document.body.classList.toggle('dense', S.settings.density === 'compact');
  $('.qbox').insertAdjacentHTML('afterbegin', I.search);
  $('[data-act="ask"]').innerHTML = SPARK;
  $('#lt').innerHTML = I.panelL;
  $('#rt').innerHTML = I.panelR;
  $('[data-act="settings"]').dataset.kbd = MOD + ',';
  document.addEventListener('keydown', e => Keys.onKey(e), true);
  document.addEventListener('click', onClick);
  document.addEventListener('input', e => {
    if (e.target.id === 'cmp-t' && S.compose) { S.compose.text = e.target.value; autosize(e.target); }
    if (e.target.id === 'rem-q') WhenPick.preview();
    if (Compose.k && /^nm-/.test(e.target.id)) Compose.input(e);
    if (Settings.adding && /^acc-f-/.test(e.target.id)) Settings.adding[e.target.id.slice(6)] = e.target.value;
  });
  document.addEventListener('focusin', e => Compose.focusIn(e));
  document.addEventListener('focusout', e => Compose.focusOut(e));
  $('#q').addEventListener('input', () => Search.input());
  $('#tabs').addEventListener('scroll', () => fitTabs(false), { passive: true });
  $('#q').addEventListener('blur', () => Search.blur());
  addEventListener('resize', onResize);
  Tip.init();
  Chat.seed();
  render();
}
boot();
</script>
