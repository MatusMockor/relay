<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pošta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #0d0f14;
  --panel: #12151c;
  --raised: #181c25;
  --hover: #1d2230;
  --sel: #232a3b;
  --line: #222838;
  --line-soft: #1a1f2b;
  --fg: #eceef4;
  --fg2: #b9bdca;
  --muted: #7d8394;
  --faint: #565c6c;
  --accent: #8ea2ff;
  --accent-ink: #0d0f14;
  --accent-soft: rgba(142, 162, 255, .12);
  --ok: #5fd39a;
  --warn: #f2b45a;
  --bad: #ff7a7a;
  --jira: #6aa8ff;
  --acc-1: var(--jira);
  --acc-2: #74c4a2;
  --acc-3: #d9a878;
  --acc-4: #d48fa8;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; text-align: inherit; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input:focus-visible, textarea:focus-visible { outline: none; }
[hidden] { display: none !important; }

.app { flex: 1; min-height: 0; display: flex; }

.av { flex: none; width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--fg); background: var(--c, #3a4256); }
.av.lg { width: 56px; height: 56px; font-size: 18px; }
.av.sm { width: 22px; height: 22px; font-size: 9px; }
.c1 { --c: #4b5fa8; } .c2 { --c: #8a4f7d; } .c3 { --c: #3f7d6a; } .c4 { --c: #9a6a36; } .c5 { --c: #5b4f9a; } .c6 { --c: #2f6f8f; } .c7 { --c: #7a3f3f; }
.key { font-family: var(--mono); font-size: 11.5px; color: var(--jira); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 5px; font-size: 11px; font-weight: 600; background: var(--raised); color: var(--fg2); white-space: nowrap; }
.spark { width: 12px; height: 12px; flex: none; }
.kbd { font-family: var(--mono); font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; line-height: 16px; white-space: nowrap; }
mark { background: rgba(142, 162, 255, .24); color: var(--fg); border-radius: 3px; padding: 0 1px; }

/* ===== A ===== */
.a-main { flex: 1; min-width: 0; display: flex; flex-direction: column; container: main / inline-size; }
.a-top { display: flex; align-items: center; gap: 28px; padding: 18px 32px 14px; min-height: 62px; }
.a-tabs { display: flex; gap: 26px; align-items: center; min-width: 0; position: relative; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.a-tabs::-webkit-scrollbar { display: none; }
.a-tab { font-size: 15px; font-weight: 600; color: var(--faint); display: flex; gap: 7px; align-items: baseline; position: relative; padding-bottom: 8px; flex: none; white-space: nowrap; }
.a-tab:hover { color: var(--muted); }
.a-tab b { font-weight: 600; font-size: 13px; color: var(--faint); }
.a-tab.on { color: var(--fg); }
.a-tab.on b { color: var(--accent); }
.a-tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; border-radius: 2px; background: var(--fg); }
.a-sep { width: 1px; height: 16px; background: var(--line); margin-bottom: 8px; }
.a-top .right { margin-left: auto; display: flex; gap: 14px; align-items: center; color: var(--muted); font-size: 13px; flex: none; }
.srch { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; padding: 4px 2px; border-radius: 7px; }
.srch:hover { color: var(--fg2); }
.qbox { display: none; align-items: center; gap: 8px; width: 290px; height: 32px; padding: 0 10px; border-radius: 8px; background: var(--raised); border: 1px solid var(--line); color: var(--muted); }
.qbox input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--fg); font-size: 13.5px; }
.qbox input::placeholder { color: var(--muted); }
.searching .qbox { display: flex; }
.searching .srch { display: none; }
.ibtn { width: 30px; height: 30px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.ibtn:hover { background: var(--hover); color: var(--fg); }
.ibtn.ai { color: var(--accent); }
.ibtn.ai .spark { width: 15px; height: 15px; }
.me-btn { border-radius: 50%; }
.me-btn:hover .av { box-shadow: 0 0 0 2px var(--line); }

.a-list { flex: 1; overflow: auto; padding: 4px 16px 24px; position: relative; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 12px); mask-image: linear-gradient(to bottom, transparent 0, #000 12px); }
.a-list[hidden] { display: none; }
.a-row { display: grid; grid-template-columns: 14px 140px minmax(0, 1fr) auto; gap: 14px; align-items: center; height: 46px; padding: 0 16px; border-radius: 10px; color: var(--fg2); position: relative; cursor: default; --rowbg: var(--bg); }
.a-row:hover { background: var(--hover); --rowbg: var(--hover); }
.a-row.sel { background: var(--sel); --rowbg: var(--sel); }
.a-row .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.a-row .who { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-row .who small { color: var(--faint); font-weight: 500; margin-left: 4px; }
.a-row.unread .who, .a-row.unread .subj { color: var(--fg); font-weight: 600; }
.a-row .line { display: flex; gap: 10px; align-items: center; min-width: 0; white-space: nowrap; }
.a-row .subj { color: var(--fg2); flex: 0 1 auto; min-width: 64px; max-width: 52%; overflow: hidden; text-overflow: ellipsis; }
.a-row .snip { color: var(--muted); overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 0; }
.a-row .snip.ai { color: var(--fg2); display: inline-flex; align-items: center; gap: 6px; }
.a-row .snip.ai svg { color: var(--accent); }
.a-row .snip.ai span { overflow: hidden; text-overflow: ellipsis; }
.a-row .snip.ai.new { animation: fadein .6s ease-out; }
.a-row .snip.wait { color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
.a-row .snip.wait i, .wait-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: .6; animation: pulse 1.6s ease-in-out infinite; flex: none; }
.a-row .st { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); padding-left: 10px; }
.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.st-warn::before { background: var(--warn); } .st-bad::before { background: var(--bad); } .st-acc::before { background: var(--accent); } .st-ok::before { background: var(--ok); }
.a-row time { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.a-row .acts { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: none; gap: 2px; background: var(--rowbg); padding-left: 4px; }
.a-row .acts::before { content: ""; position: absolute; right: 100%; top: 0; bottom: 0; width: 36px; background: linear-gradient(90deg, transparent, var(--rowbg)); }
.a-row:hover .acts { display: flex; }
.a-row:hover time { visibility: hidden; }
.act { width: 30px; height: 30px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; color: var(--fg2); }
.act:hover { background: rgba(255, 255, 255, .07); color: var(--fg); }
.a-row.fresh { animation: fresh 3s ease-out; }
.a-row.out { height: 0 !important; opacity: 0; overflow: hidden; transition: height .15s ease, opacity .12s ease; }
.a-day { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 16px 16px 6px; font-weight: 600; }

.a-prof { display: flex; flex-direction: column; gap: 10px; }
.a-prof h3 { margin: 4px 0 0; font-size: 17px; }
.a-prof p { margin: 0; color: var(--muted); font-size: 13px; }
.sec h4 { margin: 0 0 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.ai-card { border-radius: 10px; background: var(--accent-soft); padding: 12px 14px; color: var(--fg); font-size: 13.5px; display: grid; gap: 6px; }
.ai-card .h { display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 12px; font-weight: 600; }
.ai-card.wait { color: var(--muted); }
.ai-card.wait .w { display: inline-flex; align-items: center; gap: 8px; }
.mini { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.mini > * { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; color: var(--fg2); font-size: 13px; border-bottom: 1px solid var(--line-soft); width: 100%; text-align: left; }
.mini > button:hover span:first-child { color: var(--fg); }
.mini > * span:last-child { color: var(--muted); white-space: nowrap; font-size: 12px; }
.mini > * span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* ===== Thread ===== */
.t-nav { display: flex; align-items: center; gap: 4px; min-width: 0; flex: 1; }
.t-nav[hidden], .a-tabs[hidden] { display: none; }
.t-back { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: var(--fg2); height: 30px; padding: 0 10px 0 6px; margin-left: -8px; border-radius: 8px; min-width: 0; white-space: nowrap; }
.t-back svg { flex: none; }
.t-back span { overflow: hidden; text-overflow: ellipsis; }
.t-acts, .t-pos { flex: none; }
.t-back:hover { background: var(--hover); color: var(--fg); }
.t-acts { display: flex; gap: 2px; margin-left: 12px; padding-left: 12px; border-left: 1px solid var(--line-soft); }
.t-pos { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; margin-left: 12px; display: flex; align-items: center; gap: 2px; }
.t-pos span { margin-right: 6px; }
.t-scroll { flex: 1; overflow: auto; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14px); mask-image: linear-gradient(to bottom, transparent 0, #000 14px); }
.t-scroll[hidden] { display: none; }
.t-col { max-width: 744px; margin: 0 auto; padding: 18px 32px 64px; display: flex; flex-direction: column; gap: 18px; }
.t-h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.01em; line-height: 1.3; text-wrap: balance; }
.t-meta { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 13px; margin-top: -8px; flex-wrap: wrap; }
.t-sum { border-radius: 12px; background: var(--accent-soft); padding: 14px 16px; display: grid; gap: 8px; }
.t-sum .h { display: flex; gap: 6px; align-items: center; color: var(--accent); font-size: 12px; font-weight: 600; }
.t-sum p { margin: 0; color: var(--fg); font-size: 14px; line-height: 1.55; }
.t-sum ul { list-style: none; margin: 2px 0 0; padding: 0; display: grid; gap: 2px; }
.t-sum.wait p { color: var(--muted); display: flex; align-items: center; gap: 8px; }
.chk { display: flex; gap: 10px; align-items: center; font-size: 13.5px; color: var(--fg2); padding: 3px 0; }
.chk .box { width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--accent); flex: none; display: inline-flex; align-items: center; justify-content: center; color: var(--accent-ink); }
.chk .box svg { opacity: 0; }
.chk.on .box { background: var(--accent); }
.chk.on .box svg { opacity: 1; }
.chk.on .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.t-earlier { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; margin: 0 -12px; }
.t-earlier:empty { display: none; }
.m-c { display: flex; gap: 12px; align-items: center; padding: 9px 12px; border-radius: 10px; color: var(--muted); font-size: 13.5px; width: 100%; min-width: 0; }
.m-c:hover { background: var(--hover); }
.m-c b { color: var(--fg2); font-weight: 600; flex: none; }
.m-c .s { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.m-c time { flex: none; font-size: 12.5px; }
.t-earlier .msg { padding: 12px; border-radius: 10px; }
.msg { display: grid; gap: 12px; }
.msg .mh { display: flex; gap: 12px; align-items: center; }
.msg .mh > div { display: grid; }
.msg .mh b { font-weight: 600; }
.msg .mh small { color: var(--muted); font-size: 12px; }
.msg .mh time { margin-left: auto; color: var(--muted); font-size: 12.5px; }
.msg .mh.tog { cursor: pointer; }
.msg .txt { color: var(--fg); font-size: 15px; line-height: 1.6; max-width: 640px; padding-left: 40px; }
.msg .txt p { margin: 0 0 10px; }
.msg .txt p:last-child { margin-bottom: 0; }
.msg.mine .txt { color: var(--fg2); }
.jb .ja { color: var(--fg2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; padding: 1px 8px; border-radius: 6px; background: var(--raised); color: var(--fg2); font-size: 13px; font-weight: 500; line-height: 1.6; }
.pill.to { background: var(--sel); color: var(--fg); }
.jb blockquote { margin: 10px 0 0; padding: 1px 0 1px 14px; border-left: 2px solid var(--line); color: var(--fg); }
.t-next { margin-top: 10px; display: grid; gap: 12px; padding-left: 40px; }
.t-next h4 { margin: 0; display: flex; gap: 7px; align-items: center; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.t-next h4 svg { color: var(--accent); }
.t-next .note { color: var(--muted); font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
.sugs { display: flex; flex-wrap: wrap; gap: 8px; }
.sug { display: inline-flex; align-items: center; gap: 9px; padding: 6px 14px 6px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--fg2); font-size: 13.5px; }
.sug:hover { background: var(--hover); color: var(--fg); }
.sug .kbd { min-width: 18px; text-align: center; border-radius: 99px; }
.sug.own { border-color: transparent; color: var(--muted); }
.sug.own:hover { color: var(--fg); }

.cmp { margin-top: 6px; margin-left: 40px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); display: grid; animation: fadein .15s ease-out; }
.cmp-h { display: flex; gap: 8px; align-items: center; padding: 11px 14px 0; font-size: 12.5px; color: var(--muted); min-width: 0; }
.cmp-h b { color: var(--fg2); font-weight: 500; }
.cmp-h .s { margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmp-b { position: relative; padding: 8px 14px 4px; }
.cmp textarea { display: block; width: 100%; min-height: 120px; resize: none; background: none; border: 0; outline: 0; color: var(--fg); font-size: 15px; line-height: 1.6; padding: 0; }
.cmp textarea::placeholder { color: var(--muted); }
.cmp.busy textarea { opacity: .2; filter: blur(1.5px); transition: opacity .2s, filter .2s; }
.cmp.flash textarea { animation: fadein .5s ease-out; }
.cmp-busy { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 9px; color: var(--accent); font-family: var(--mono); font-size: 12px; overflow: hidden; border-radius: 8px; }
.cmp-busy svg { width: 14px; height: 14px; animation: twinkle 1s ease-in-out infinite; }
.cmp-busy::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(142, 162, 255, .10) 50%, transparent 70%); background-size: 200% 100%; animation: sweep 1.1s linear infinite; }
.cmp-ai { display: flex; align-items: center; gap: 9px; margin: 4px 10px 0; padding: 7px 8px 7px 12px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); }
.cmp-ai input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--fg); font-size: 13.5px; }
.cmp-ai input::placeholder { color: var(--muted); }
.chipb { font-size: 12px; padding: 3px 9px; border-radius: 99px; color: var(--fg2); background: rgba(255, 255, 255, .05); white-space: nowrap; }
.chipb:hover { color: var(--fg); background: rgba(255, 255, 255, .09); }
.cmp-f { display: flex; align-items: center; gap: 8px; padding: 10px; }
.cmp-f .sp { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 7px; font-size: 12.5px; font-weight: 500; border: 1px solid var(--line); color: var(--fg2); background: var(--panel); white-space: nowrap; }
.btn:hover { color: var(--fg); background: var(--hover); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.pri:hover { background: #a1b2ff; }
.btn.pri .kbd { color: var(--accent-ink); border-color: rgba(13, 15, 20, .28); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost svg.spark { color: var(--accent); }
.btn.ghost:hover { background: var(--hover); }

/* ===== Empty ===== */
.zero { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.zero-in { position: relative; z-index: 1; text-align: center; display: grid; gap: 10px; justify-items: center; margin-top: -9vh; animation: fadein .6s ease-out; }
.zero h2 { margin: 0; font-size: 34px; font-weight: 600; letter-spacing: -.025em; color: var(--fg); }
.zero.small h2 { font-size: 22px; letter-spacing: -.01em; }
.zero p { margin: 0; color: var(--muted); font-size: 14px; max-width: 380px; }
.zero .go { display: flex; gap: 8px; margin-top: 14px; }
.horizon { position: absolute; left: 0; right: 0; bottom: 0; height: 36%; background: linear-gradient(180deg, rgba(142, 162, 255, .06), transparent 70%); animation: fadein 1.2s ease-out; }
.horizon::before { content: ""; position: absolute; left: 10%; right: 10%; top: -110px; height: 220px; background: radial-gradient(50% 50% at 50% 50%, rgba(142, 162, 255, .16), transparent 72%); }
.horizon::after { content: ""; position: absolute; left: 6%; right: 6%; top: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(142, 162, 255, .45), transparent); }

/* ===== Overlays ===== */
.ov { position: fixed; inset: 0; z-index: 50; display: flex; justify-content: center; align-items: flex-start; padding: 13vh 16px 0; background: rgba(6, 7, 10, .58); animation: ovin .12s ease-out; }
.ov.mid { align-items: center; padding-top: 0; }
.ov.clear { background: transparent; animation: none; }
.pal { width: min(640px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 30px 80px rgba(0, 0, 0, .55); overflow: hidden; display: flex; flex-direction: column; max-height: 72vh; animation: palin .14s ease-out; }
.pal-in { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line-soft); color: var(--muted); }
.pal-in input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--fg); font-size: 17px; }
.pal-in input::placeholder { color: var(--muted); }
.pal-in .spark { width: 16px; height: 16px; color: var(--accent); }
.pal-body { overflow: auto; padding: 4px 8px 8px; }
.grp { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 12px 12px 6px; font-weight: 600; }
.pi { display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 8px; color: var(--fg2); font-size: 14px; width: 100%; }
.pi.on { background: var(--sel); color: var(--fg); }
.pi .ic { width: 22px; flex: none; display: inline-flex; justify-content: center; color: var(--muted); }
.pi .ic .spark { width: 13px; height: 13px; color: var(--accent); }
.pi.on .ic { color: var(--fg2); }
.pi .lb { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pi .lb small { color: var(--muted); margin-left: 8px; font-size: 13px; }
.pi .kk { display: flex; gap: 4px; flex: none; }
.pi .wh { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; flex: none; }
.pal-foot { display: flex; gap: 16px; padding: 9px 18px; border-top: 1px solid var(--line-soft); color: var(--muted); font-size: 12px; }
.pal-foot span { display: inline-flex; gap: 6px; align-items: center; }
.pal-empty { padding: 22px 12px; color: var(--muted); font-size: 13.5px; }

.ask-meta { display: flex; align-items: center; gap: 10px; padding: 8px 20px; border-bottom: 1px solid var(--line-soft); font-size: 12px; color: var(--muted); }
.ask-meta .ctx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ask-meta .ctx b { color: var(--fg2); font-weight: 500; }
.runner { margin-left: auto; display: inline-flex; gap: 6px; align-items: center; flex: none; }
.runner button { color: var(--faint); font-size: 12px; }
.runner button:hover { color: var(--fg2); }
.runner button.on { color: var(--fg2); }
.runner .dt { color: var(--faint); }
.ask-out { padding: 16px 20px 20px; display: grid; gap: 14px; }
.ask-q { color: var(--fg2); font-size: 13.5px; }
.steps { font-family: var(--mono); font-size: 11.5px; color: var(--muted); display: grid; gap: 4px; }
.steps div { display: flex; gap: 8px; align-items: center; animation: fadein .2s ease-out; }
.steps div::before { content: "✓"; color: var(--ok); width: 10px; }
.steps div.run::before { content: ""; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; }
.ans { font-size: 14px; line-height: 1.6; color: var(--fg); display: grid; gap: 10px; animation: fadein .3s ease-out; }
.ans p { margin: 0; }
.ans ol { margin: 0; padding-left: 20px; display: grid; gap: 7px; }
.ans ol li::marker { color: var(--muted); }
.ans .meta { color: var(--muted); font-size: 13px; }
.ref { display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; height: 22px; border-radius: 6px; background: var(--raised); color: var(--fg2); font-size: 12.5px; vertical-align: 1px; max-width: 100%; }
.ref:hover { background: var(--sel); color: var(--fg); }
.ref .key { font-size: 11px; }
.refs { display: flex; flex-wrap: wrap; gap: 6px; }
.card { border: 1px solid var(--line); border-radius: 10px; background: var(--raised); padding: 12px; display: grid; gap: 8px; }
.card .ct { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
.card .ct b { color: var(--fg2); font-weight: 600; }
.card .draft { font-size: 13.5px; color: var(--fg); line-height: 1.55; }
.card .btns { display: flex; gap: 8px; align-items: center; }
.card .ref { background: var(--hover); }
.card .ref:hover { background: var(--sel); }
.task { display: flex; gap: 10px; align-items: center; }
.task .box { width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--accent); flex: none; }
.task div { display: grid; font-size: 13.5px; }
.task small { color: var(--muted); font-size: 12px; }
.ans-foot { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }

.sheet { width: min(800px, 100%); height: min(580px, 82vh); display: grid; grid-template-columns: 210px minmax(0, 1fr); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, .55); animation: palin .14s ease-out; }
.sh-nav { background: var(--bg); padding: 20px 10px 16px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--line-soft); }
.sh-nav h3 { margin: 0 0 12px 10px; font-size: 15px; font-weight: 600; }
.sh-nav button { padding: 7px 10px; border-radius: 8px; color: var(--fg2); font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
.sh-nav button:hover { background: var(--hover); }
.sh-nav button.on { background: var(--sel); color: var(--fg); }
.sh-nav .stat { margin-left: auto; }
.sh-nav .proto { margin-top: auto; padding: 0 10px; font-size: 12px; color: var(--faint); }
.sh-main { padding: 26px 30px; overflow: auto; }
.sh-main h2 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
.sh-main .lead { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
.srow { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 14px 0; border-bottom: 1px solid var(--line-soft); }
.srow:last-child { border-bottom: 0; }
.srow .l { display: grid; gap: 2px; min-width: 0; }
.srow .l b { font-weight: 500; color: var(--fg); font-size: 14px; }
.srow .l span { color: var(--muted); font-size: 13px; }
.srow .r { display: flex; align-items: center; gap: 10px; flex: none; color: var(--fg2); font-size: 13px; }
.seg { display: flex; gap: 3px; background: var(--bg); border: 1px solid var(--line-soft); border-radius: 9px; padding: 3px; }
.seg button { padding: 5px 10px; border-radius: 6px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.seg button:hover { color: var(--fg2); }
.seg button.on { background: var(--raised); color: var(--fg); }
.sw { width: 36px; height: 20px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg2); transition: transform .15s, background .15s; }
.sw.on { background: var(--accent); }
.sw.on::after { transform: translateX(16px); background: var(--fg); }
.stat { display: inline-flex; align-items: center; gap: 7px; color: var(--fg2); font-size: 13px; white-space: nowrap; }
.stat i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.stat.off i { background: var(--faint); }
.stat.busy i { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
.mono { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.rule { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 14px 0; border-bottom: 1px solid var(--line-soft); align-items: center; }
.rule b { font-weight: 600; font-size: 14px; }
.rule p { margin: 0; color: var(--fg2); font-size: 13px; grid-column: 1; }
.rule .mono { grid-column: 1; }
.rule .cnt { grid-row: 1 / span 3; grid-column: 2; color: var(--muted); font-size: 13px; }

.keys { width: min(780px, 100%); max-height: 82vh; overflow: auto; padding: 24px 30px 26px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 30px 80px rgba(0, 0, 0, .55); animation: palin .14s ease-out; }
.keys h2 { margin: 0 0 18px; font-size: 17px; font-weight: 600; display: flex; align-items: baseline; gap: 12px; }
.keys h2 span { color: var(--muted); font-size: 13px; font-weight: 400; }
.kgrid { columns: 2; column-gap: 40px; }
.kg { break-inside: avoid; margin-bottom: 20px; }
.kg h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.kr { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 13.5px; color: var(--fg2); border-bottom: 1px solid var(--line-soft); }
.kr .kk { display: flex; gap: 4px; }
.keys .proto { margin-top: 4px; font-size: 12px; color: var(--faint); }

.pop { position: fixed; z-index: 60; width: 290px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 50px rgba(0, 0, 0, .5); padding: 4px 6px 6px; animation: palin .12s ease-out; }
.pop .pi { min-height: 36px; font-size: 13.5px; padding: 0 10px; }
.pop .grp { padding: 10px 10px 4px; }
.pop-in { margin: 6px 0 0; padding: 9px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line-soft); display: grid; gap: 4px; }
.pop-in input { background: none; border: 0; outline: 0; color: var(--fg); font-size: 13.5px; }
.pop-in input::placeholder { color: var(--muted); }
.pop-in .pv { font-size: 12.5px; color: var(--muted); }
.pop-in .pv.ok { color: var(--accent); }

.cf { width: min(400px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 6px; box-shadow: 0 30px 80px rgba(0, 0, 0, .55); animation: palin .12s ease-out; }
.cf h3 { margin: 0; font-size: 16px; font-weight: 600; }
.cf p { margin: 0 0 14px; color: var(--muted); font-size: 13.5px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cf .btns { display: flex; justify-content: flex-end; gap: 8px; }

.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 70; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; border-radius: 10px; background: var(--raised); border: 1px solid var(--line); box-shadow: 0 12px 40px rgba(0, 0, 0, .45); font-size: 13.5px; color: var(--fg); animation: toastin .18s ease-out; white-space: nowrap; }
.toast[hidden] { display: none; }
.toast .dt { color: var(--faint); }
.toast .u { color: var(--accent); font-weight: 600; display: inline-flex; gap: 7px; align-items: center; padding: 3px 7px; border-radius: 6px; }
.toast .u:hover { background: var(--hover); }
.toast .u .kbd { color: var(--accent); border-color: rgba(142, 162, 255, .3); }
.toast.plain { padding-right: 16px; }

.tip { position: fixed; z-index: 90; pointer-events: none; background: var(--raised); border: 1px solid var(--line); color: var(--fg2); font-size: 12px; padding: 5px 8px; border-radius: 7px; display: flex; gap: 8px; align-items: center; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); white-space: nowrap; }
.tip[hidden] { display: none; }
.tip.long { display: block; white-space: normal; width: max-content; max-width: 340px; line-height: 1.5; font-size: 12.5px; color: var(--fg); padding: 8px 10px; }

/* ===== folders ===== */
.a-main, .a-list, .t-scroll, .fold, .spane, .chat-log, .pal-body, .sh-main, .keys { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.ico { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.fold { flex: none; width: 214px; background: var(--panel); border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; padding: 14px 10px 12px; gap: 2px; overflow: auto; container: fold / inline-size; }
.fold .brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 14px; font-weight: 600; }
.fold .brand i { width: 20px; height: 20px; border-radius: 6px; background: var(--accent); display: inline-block; }
.fold .brand button { margin-left: auto; color: var(--faint); width: 26px; height: 26px; margin-right: -4px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; }
.fold .brand button:hover { background: var(--hover); color: var(--fg2); }
.fold .compose { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 10px; border-radius: 9px; background: var(--raised); color: var(--fg); font-weight: 500; width: 100%; }
.fold .compose:hover { background: var(--hover); }
.fold .compose .kbd { margin-left: auto; }
.f { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--fg2); font-size: 13.5px; width: 100%; }
.f:hover { background: var(--hover); }
.f.on { background: var(--sel); color: var(--fg); font-weight: 600; }
.f .n { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.f.on .n { color: var(--accent); }
.fold h5 { margin: 16px 10px 6px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.lbl-dot { width: 8px; height: 8px; border-radius: 3px; background: var(--d); flex: none; margin: 0 4px; }
.fold-foot { margin-top: auto; padding: 16px 10px 2px; display: grid; gap: 6px; justify-items: start; }
.fold-foot .stat { font-size: 12px; color: var(--muted); }
.fold-foot .stat:hover { color: var(--fg2); }
.fold-foot .proto { font-size: 11.5px; color: var(--faint); }
#lt { margin-right: -14px; }
.ibtn.on { color: var(--fg2); }
.a-title { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1; }
.a-title h2 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; gap: 9px; white-space: nowrap; }
.a-title h2 .ico { color: var(--muted); }
.a-title h2 .lbl-dot { margin: 0 2px; }
.a-title h2 b { font-size: 13px; color: var(--accent); font-weight: 600; }
.a-title .sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.a-row .line > .chip { flex: none; margin-right: -2px; }
.a-row .line:has(.snip.ai) .subj { max-width: 42%; }
.a-row .snip .chip { vertical-align: 1px; }
.dense .a-row { height: 36px; border-radius: 8px; }
.dense .a-day { padding: 10px 16px 4px; }
.dense .a-row .act { width: 26px; height: 26px; }

/* ===== right panel ===== */
.side { flex: none; width: 300px; border-left: 1px solid var(--line-soft); background: var(--panel); display: flex; flex-direction: column; min-height: 0; container: side / inline-size; }
.stabs { flex: none; display: flex; gap: 4px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
.stab { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 7px; font-size: 12.5px; color: var(--muted); font-weight: 500; white-space: nowrap; min-width: 0; }
.stab svg { flex: none; }
.stab:hover { color: var(--fg2); background: var(--hover); }
.stab.on { background: var(--raised); color: var(--fg); }
.stab svg { width: 14px; height: 14px; }
.stab .spark { width: 12px; height: 12px; }
.stabs .sp { flex: 1; }
.stabs .ibtn { width: 26px; height: 26px; }
.spane { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
.nw { white-space: nowrap; }
.side .ai-card .btn small { color: var(--muted); font-weight: 400; }
.sbody { padding: 22px; display: flex; flex-direction: column; gap: 20px; }
.pacts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.pacts .btn .spark { color: var(--accent); }
.kv { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 7px 10px; margin: 0; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; color: var(--fg2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv dd.mono { font-size: 11.5px; line-height: 19px; }
.mini .fn { font-family: var(--mono); font-size: 12px; color: var(--fg2); }
.side .ai-card .btn { justify-self: start; margin-top: 4px; }
.side .ai-card .note { color: var(--muted); font-size: 12.5px; }

.chatpane { display: flex; flex-direction: column; overflow: hidden; }
.chat-ctx { flex: none; display: flex; align-items: center; gap: 8px; padding: 9px 16px; border-bottom: 1px solid var(--line-soft); font-size: 12px; color: var(--muted); min-width: 0; }
.chat-ctx .ctx { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-ctx b { color: var(--fg2); font-weight: 500; }
.chat-ctx .runner button { font-size: 11.5px; }
.chat-log { flex: 1; min-height: 0; overflow: auto; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 18px; }
.chat-day { align-self: center; font-size: 11px; color: var(--faint); letter-spacing: .04em; }
.turn { display: grid; gap: 10px; }
.bub { justify-self: end; background: var(--sel); color: var(--fg); padding: 8px 12px; border-radius: 12px 12px 4px 12px; font-size: 13.5px; max-width: 88%; animation: fadein .2s ease-out; }
.turn .ans { font-size: 13.5px; line-height: 1.55; gap: 8px; }
.turn .ans ol { padding-left: 18px; gap: 6px; }
.turn .ans .meta { font-size: 12.5px; }
.turn .card { padding: 11px; }
.turn .card .btns { flex-wrap: wrap; }
.turn .card .draft { font-size: 13px; }
.turn .ans-foot { font-size: 11px; margin-top: 2px; }
.turn .ref { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-ex { flex: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px 10px; border-top: 1px solid var(--line-soft); }
.chat-ex .chipb { font-size: 12px; padding: 4px 10px; }
.chat-in { flex: none; margin: 0 14px 14px; border: 1px solid var(--line); border-radius: 11px; padding: 0 8px 0 12px; height: 42px; display: flex; align-items: center; gap: 8px; background: var(--bg); color: var(--accent); }
.chat-in:focus-within { border-color: rgba(142, 162, 255, .45); }
.chat-in input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--fg); font-size: 13px; }
.chat-in input::placeholder { color: var(--faint); }

.cal-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.cal-h h3 { margin: 0; font-size: 17px; font-weight: 600; }
.cal-h span { color: var(--muted); font-size: 12.5px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; margin-top: -6px; }
.wd { display: grid; justify-items: center; gap: 2px; padding: 6px 0 6px; border-radius: 8px; color: var(--muted); font-size: 11px; }
.wd b { font-size: 14px; color: var(--fg2); font-weight: 600; font-variant-numeric: tabular-nums; }
.wd:hover { background: var(--hover); }
.wd.on { background: var(--sel); }
.wd.on b { color: var(--fg); }
.wd.today b { color: var(--accent); }
.wd i { width: 4px; height: 4px; border-radius: 50%; background: var(--faint); }
.wd i.none { visibility: hidden; }
.agenda { display: grid; gap: 2px; margin: -6px -8px 0; }
.ev { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; padding: 7px 8px; border-radius: 9px; width: 100%; text-align: left; cursor: default; }
button.ev { cursor: pointer; }
button.ev:hover { background: var(--hover); }
.ev time { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; text-align: right; padding-top: 1px; }
.ev .eb { border-left: 2px solid var(--c, var(--line)); padding-left: 10px; display: grid; gap: 1px; min-width: 0; }
.ev .eb b { font-weight: 500; color: var(--fg); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .eb span { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev.past { opacity: .45; }
.ev.focus .eb { background: var(--accent-soft); border-left-color: var(--accent); border-radius: 0 7px 7px 0; padding: 4px 10px; }
.ev.info .eb b { color: var(--fg2); font-weight: 400; }
.now { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center; padding: 0 8px; color: var(--accent); font-size: 11.5px; font-variant-numeric: tabular-nums; font-weight: 600; }
.now span { text-align: right; }
.now i { height: 1px; background: var(--accent); opacity: .7; position: relative; }
.now i::before { content: ""; position: absolute; left: -3px; top: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.ev-empty { color: var(--muted); font-size: 13px; padding: 6px 8px 8px; }

/* ===== new mail ===== */
.nm { width: min(680px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 30px 80px rgba(0, 0, 0, .55); display: grid; animation: palin .14s ease-out; }
.nm-h { display: flex; align-items: center; gap: 10px; padding: 12px 12px 6px 20px; }
.nm-h b { font-size: 15px; font-weight: 600; }
.nm-h .sp { flex: 1; }
.nm-h .mono { font-size: 11.5px; }
.nm-f { display: flex; align-items: center; gap: 10px; margin: 0 20px; min-height: 44px; border-bottom: 1px solid var(--line-soft); position: relative; }
.nm-f > .lb { width: 56px; flex: none; color: var(--muted); font-size: 13px; }
.nm-f input { flex: 1; min-width: 0; height: 42px; background: none; border: 0; outline: 0; color: var(--fg); font-size: 14px; }
.nm-f input::placeholder { color: var(--faint); }
.to-chip { display: inline-flex; align-items: center; gap: 7px; padding: 2px 3px 2px 3px; border-radius: 99px; background: var(--raised); font-size: 13px; color: var(--fg); flex: none; }
.to-chip .av { width: 22px; height: 22px; font-size: 9px; }
.to-chip small { color: var(--muted); font-size: 12px; }
.to-chip button { color: var(--muted); width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
.to-chip button:hover { background: var(--hover); color: var(--fg); }
.ac { position: absolute; left: 62px; top: 100%; margin-top: 4px; width: 360px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 18px 50px rgba(0, 0, 0, .5); padding: 4px; z-index: 3; }
.ac .grp { padding: 8px 10px 4px; }
.ac .pi { min-height: 40px; font-size: 13.5px; padding: 0 10px; }
.ac .pi .lb small { font-size: 12.5px; }
.nm .cmp-b { padding: 14px 20px 6px; }
.nm textarea { display: block; width: 100%; min-height: 230px; resize: none; background: none; border: 0; outline: 0; color: var(--fg); font-size: 15px; line-height: 1.6; padding: 0; }
.nm textarea::placeholder { color: var(--muted); }
.nm.busy textarea { opacity: .2; filter: blur(1.5px); transition: opacity .2s, filter .2s; }
.nm.flash textarea { animation: fadein .5s ease-out; }
.nm .cmp-ai { margin: 4px 14px 0; }
.nm .cmp-f { padding: 12px 14px 14px; border-top: 1px solid var(--line-soft); margin-top: 8px; }
.nm .cmp-f .btn .ico, .nm .cmp-f .btn svg:not(.spark) { color: var(--muted); }

@container main (max-width: 700px) {
  .a-top { padding: 16px 20px 12px; gap: 18px; }
  .a-tabs { gap: 18px; }
  .a-list { padding: 4px 8px 24px; }
  .a-title .sub { display: none; }
  .t-col { padding: 16px 22px 56px; }
  .msg .txt, .t-next, .sugs { padding-left: 0; }
  .cmp { margin-left: 0; }
}
@container main (max-width: 600px) {
  .a-row { grid-template-columns: 10px 108px minmax(0, 1fr) auto; gap: 10px; padding: 0 10px; }
  .a-row .who small { display: none; }
  .a-row .subj { max-width: 46%; }
  .srch > span:first-child { display: none; }
}

  const marks = new Array(chars.length).fill(false);
  let from = 0;
  let at = hay.indexOf(needle, from);
  while (at !== -1) {
    for (let k = at; k < at + needle.length; k++) marks[map[k]] = true;
    from = at + needle.length;
    at = hay.indexOf(needle, from);
  }
  let out = '';
  let open = false;
  chars.forEach((ch, i) => {
    if (marks[i] !== open) { out += open ? '</mark>' : '<mark>'; open = marks[i]; }

}

function fuzzy(q, text) {

  const words = n.split(/\s+/);
  if (words.length > 1 && words.every(w => h.includes(w))) return 45;
  let qi = 0;
  let prev = -1;
  let gaps = 0;
  for (let hi = 0; hi < h.length && qi < n.length; hi++) {
    if (h[hi] !== n[qi]) continue;
    if (prev >= 0) gaps += hi - prev - 1;
    prev = hi;
    qi++;
  }
  if (qi < n.length) return 0;
  return Math.max(1, 30 - gaps);
}

  }
  let offset = [[/\bpozajtra\b/, 2], [/\bzajtra\b/, 1], [/\bdnes\b/, 0]].find(([r]) => r.test(s))?.[1] ?? null;
  const wd = WEEKDAY_STEMS.find(([stem]) => s.includes(stem));
  if (offset === null && wd) offset = ((wd[1] - NOW.getDay() + 7) % 7) || 7;
  if (offset === null && /buduci tyzd|o tyzden/.test(s)) offset = 7;
  const date = s.match(/\b(\d{1,2})\. ?(\d{1,2})\.(?!\d)/);
  const tm = s.match(/(\d{1,2})[:.](\d{2})(?!\.)/);
  const oh = s.match(/(?:^|\s)o (\d{1,2})(?: ?h| hod)?$/) || s.match(/^(\d{1,2}) ?h$/);
  const part = DAY_PARTS.find(([w]) => s.includes(w));
  let hh = tm ? +tm[1] : oh ? +oh[1] : part ? part[1] : null;
  const mm = tm ? +tm[2] : 0;
  if (offset === null && !date && hh === null) return null;
  if (hh !== null && (hh > 23 || mm > 59)) return null;
  if (hh === null) hh = 8;
  const d = new Date(NOW);
  if (date) d.setFullYear(NOW.getFullYear(), +date[2] - 1, +date[1]);
  if (date && dayDiff(d) < 0) d.setFullYear(NOW.getFullYear() + 1);
  if (!date) d.setDate(d.getDate() + (offset ?? 0));
  d.setHours(hh, mm, 0, 0);
  if (offset === null && !date && d <= NOW) d.setDate(d.getDate() + 1);
  return d > NOW ? d : null;
}

/* ===== layout & resize ===== */
const LIM = { l: { min: 180, max: 360, def: 214, cut: 120 }, r: { min: 260, max: 520, def: 300, cut: 200 } };
const MIN_MID = 420;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const autoBreak = () => Math.max(1180, clamp(S.wl, LIM.l.min, LIM.l.max) + (S.right ? clamp(S.wr, LIM.r.min, LIM.r.max) : 0) + MIN_MID);
const leftVisible = () => S.leftUser ?? innerWidth >= autoBreak();
function widths() {
  const lv = leftVisible();
  let l = lv ? clamp(S.wl, LIM.l.min, LIM.l.max) : 0;
  let r = S.right ? clamp(S.wr, LIM.r.min, LIM.r.max) : 0;
  let over = l + r + MIN_MID - innerWidth;
  if (over > 0 && r) { const d = Math.min(over, r - LIM.r.min); r -= d; over -= d; }
  if (over > 0 && l) l -= Math.min(over, l - LIM.l.min);
  return { l, r };
}
const Resize = {
  drag: null,
  el: side => $('#rz-' + side),
  maxFor(side) {
    const w = widths();
    const other = side === 'l' ? w.r : w.l;
    return clamp(innerWidth - MIN_MID - other, LIM[side].min, LIM[side].max);
  },
  init() {
    ['l', 'r'].forEach(side => {
      const h = this.el(side);
      h.addEventListener('pointerdown', e => this.down(e, side));
      h.addEventListener('pointermove', e => this.move(e));
      h.addEventListener('pointerup', e => this.up(e));
      h.addEventListener('pointercancel', e => this.up(e));
      h.addEventListener('lostpointercapture', e => this.up(e));
      h.addEventListener('dblclick', () => this.reset(side));
    });
  },
  apply() {
    const w = widths();
    if (w.l) $('#fold').style.width = w.l + 'px';
    if (w.r) $('#side').style.width = w.r + 'px';
    fitTabs();
    [['l', w.l, LIM.l], ['r', w.r, LIM.r]].forEach(([side, v, L]) => {
      const h = this.el(side);
      if (!h) return;
      h.hidden = !v && !(this.drag && this.drag.side === side);
      h.setAttribute('aria-valuemin', L.min);
      h.setAttribute('aria-valuemax', this.maxFor(side));
      h.setAttribute('aria-valuenow', v || 0);
      h.setAttribute('aria-valuetext', v ? `${v} px` : 'skryté');
    });
  },
  setVisible(side, on) {
    if (side === 'l') {
      if (leftVisible() === on) return;
      S.leftUser = on ? this.drag?.user0 ?? true : false;
      if (on && !leftVisible()) S.leftUser = true;
      renderFold();
      return;
    }
    if (S.right === on) return;
    S.right = on;
    renderTop();
    renderSide();
  },
  down(e, side) {
    if (e.button !== 0) return;
    e.preventDefault();
    const h = this.el(side);
    h.setPointerCapture(e.pointerId);
    h.focus({ preventScroll: true });
    const w = widths();
    this.drag = { side, id: e.pointerId, x0: e.clientX, w0: side === 'l' ? w.l : w.r, user0: S.leftUser, moved: false };
    h.classList.add('on');
    document.body.classList.add('rz-drag');
    Tip.hide();
  },
  move(e) {
    const d = this.drag;
    if (!d || e.pointerId !== d.id) return;
    const dx = e.clientX - d.x0;
    if (Math.abs(dx) > 1) d.moved = true;
    const raw = d.side === 'l' ? d.w0 + dx : d.w0 - dx;
    const L = LIM[d.side];
    if (raw < L.cut) {
      if (d.side === 'l') S.wl = d.w0; else S.wr = d.w0;
      this.setVisible(d.side, false);
      this.apply();
      return;
    }
    this.setVisible(d.side, true);
    const v = Math.round(clamp(raw, L.min, this.maxFor(d.side)));
    if (d.side === 'l') S.wl = v; else S.wr = v;
    this.apply();
  },
  up(e) {
    const d = this.drag;
    if (!d || (e.pointerId !== undefined && e.pointerId !== d.id)) return;
    const h = this.el(d.side);
    this.drag = null;
    h.classList.remove('on');
    document.body.classList.remove('rz-drag');
    if (h.hasPointerCapture && h.hasPointerCapture(d.id)) h.releasePointerCapture(d.id);
    Keys.wide = innerWidth >= autoBreak();
    this.apply();
    if (h.hidden) h.blur();
    if (d.moved) { persist(); Settings.refresh(); }
  },
  reset(side) {
    if (side === 'l') S.wl = LIM.l.def; else S.wr = LIM.r.def;
    this.apply();
    persist();
    Settings.refresh();
  },
  resetAll() {
    S.wl = LIM.l.def;
    S.wr = LIM.r.def;
    this.apply();
    persist();
    Settings.refresh();
    toast('Šírky panelov sú predvolené');
  },
  key(e) {
    const side = e.target.id === 'rz-l' ? 'l' : 'r';
    const L = LIM[side];
    const cur = side === 'l' ? widths().l : widths().r;
    const grow = side === 'l' ? 'ArrowRight' : 'ArrowLeft';
    const shrink = side === 'l' ? 'ArrowLeft' : 'ArrowRight';
    let v = null;
    if (e.key === grow) v = cur + 16;
    if (e.key === shrink) v = cur - 16;
    if (e.key === 'Home') v = L.min;
    if (e.key === 'End') v = L.max;
    if (e.key === 'Enter') v = L.def;
    if (e.key === 'Escape') { e.preventDefault(); e.target.blur(); return true; }
    if (v === null) return false;
    e.preventDefault();
    v = clamp(v, L.min, this.maxFor(side));
    if (side === 'l') S.wl = v; else S.wr = v;
    this.apply();
    persist();
    Settings.refresh();
    return true;
  },
};

const AcctMenu = {
  o: null, sel: 0, list: [], onPick: null, onClose: null, src: null, anchor: null, withAll: false,
  open({ anchor, cur, all = true, manage = true, src = null, onPick, onClose = null }) {
    if (this.o) { const same = this.src === src; this.close(false); if (same) return; }
    this.withAll = all && multi();
    this.list = [...(this.withAll ? ['all'] : []), ...ACCOUNTS.map(a => a.id), ...(manage ? ['add'] : [])];
    this.sel = Math.max(0, this.list.indexOf(cur));
    Object.assign(this, { onPick, onClose, src, anchor });
    const rows = this.list.map((id, i) => {
      if (id === 'add') return `<div class="sepl"></div><button class="pi" data-act="acm-pick" data-pi="${i}" role="menuitem"><span class="ic">${I.plus}</span><span class="lb">Pridať účet…</span></button>`;
      const a = id === 'all' ? null : ACC(id);
      const n = acctUnread(id);
      const k = this.withAll && i < 9 ? kbd(MOD + (i + 1)) : '';
      const on = id === cur;
      return `<button class="pi${on ? ' cur' : ''}" data-act="acm-pick" data-pi="${i}" role="menuitemradio" aria-checked="${on}"><span class="ic">${sqHTML(a || 'all', true)}</span><span class="lb">${esc(a ? a.name : 'Všetky účty')}<small>${esc(a ? a.email : `${nAcc(ACCOUNTS.length)} spolu`)}</small></span>${on ? `<span class="ck">${I.check}</span>` : ''}${n ? `<span class="wh" aria-label="${n} neprečítaných">${n}</span>` : ''}${k}</button>`;
    }).join('');
    const title = src === 'fold' ? 'Účty' : 'Odoslať z účtu';
    const el = Layer.make('clear', `<div class="pop acm" role="menu" aria-label="${title}"><div class="grp">${title}</div>${rows}</div>`);
    const pop = $('.pop', el);
    const r = anchor.getBoundingClientRect();
    const w = 290;
    const h = pop.offsetHeight;
    pop.style.left = clamp(r.left, 8, innerWidth - w - 8) + 'px';
    pop.style.top = (r.bottom + 6 + h > innerHeight - 8 ? Math.max(8, r.top - h - 6) : r.bottom + 6) + 'px';
    this.o = { el, key: e => this.key(e), close: () => this.close(true) };
    Layer.push(this.o);
    anchor.setAttribute('aria-expanded', 'true');
    el.addEventListener('mousemove', e => {
      const b = e.target.closest('[data-pi]');
      if (b && +b.dataset.pi !== this.sel) { this.sel = +b.dataset.pi; this.mark(); }
    });
    this.mark();
  },
  mark() {
    if (!this.o) return;
    $$('[data-pi]', this.o.el).forEach(b => b.classList.toggle('on', +b.dataset.pi === this.sel));
  },
  key(e) {
    const mod = e.metaKey || e.ctrlKey;
    if (e.key === 'Escape') { e.preventDefault(); this.close(true); return; }
    if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); this.sel = (this.sel + 1) % this.list.length; this.mark(); return; }
    if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); this.sel = (this.sel - 1 + this.list.length) % this.list.length; this.mark(); return; }
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.pick(this.sel); return; }
    if (/^Digit[1-9]$/.test(e.code) && !e.altKey) {
      e.preventDefault();
      const i = +e.code.slice(5) - 1;
      if (this.list[i] && this.list[i] !== 'add') this.pick(i);
      return;
    }
    if (mod || e.key === 'Tab') { e.preventDefault(); this.close(true); }
  },
  pick(i) {
    const id = this.list[i];
    const fn = this.onPick;
    if (!id) return;
    this.close(false);
    if (fn) fn(id);
  },
  close(cancel) {
    if (!this.o) return;
    const fn = cancel ? this.onClose : null;
    Layer.remove(this.o);
    if (this.anchor && this.anchor.isConnected) this.anchor.setAttribute('aria-expanded', 'false');
    Object.assign(this, { o: null, onPick: null, onClose: null, src: null, anchor: null });
    if (fn) fn();
  },
};

  const f = S.folder;
  if (f === 'snoozed') return c.snooze.group;
  if (f === 'sched') return c.sched.group;
  if (f === 'sent') return c.sentDay || 'Dnes';
  if (f === 'drafts') return 'Rozpísané';
  if (f === 'done') return c.doneAt ? 'Dnes' : c.day;
  if (f === 'trash') return c.trashAt ? 'Dnes' : c.day;
  return c.day;
}
function timeOf(c) {
  const f = S.folder;

/* ===== side: calendar ===== */
const mins = s => { const [h, m] = String(s).split(':'); return +h * 60 + +m; };
const fmtMin = m => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
const eventsOn = d => EVENTS.filter(e => e.d === d).sort((a, b) => mins(a.s) - mins(b.s));
function freeSlots(d) {
  const day = at(d, 0).getDay();
  if (day === 0 || day === 6) return [];
  let cur = d === 0 ? Math.max(540, Math.ceil(mins(hm(NOW)) / 15) * 15) : 540;
  const out = [];
  eventsOn(d).filter(e => e.kind !== 'info' && mins(e.s) < 1020).forEach(e => {
    if (mins(e.s) - cur >= 30) out.push([cur, mins(e.s)]);
    cur = Math.max(cur, mins(e.e));
  });
  if (1020 - cur >= 30) out.push([cur, 1020]);
  return out;
}
const slotText = s => `${fmtMin(s[0])}-${fmtMin(s[1])}`;
function evHTML(e, d) {
  const past = d === 0 && mins(e.e) <= mins(hm(NOW));
  const cls = ['ev', e.c, past && 'past', e.kind].filter(Boolean).join(' ');
  const inner = `<time>${e.s}</time><span class="eb"><b>${esc(e.t)}</b><span>${e.s}-${e.e} · ${esc(e.sub)}</span></span>`;
  return e.open ? `<button class="${cls}" data-open="${e.open}" data-tip="Otvoriť súvisiaci mail">${inner}</button>` : `<div class="${cls}">${inner}</div>`;
}
function calHTML() {
  const d = S.calDay;
  const date = at(d, 0);
  const strip = [0, 1, 2, 3, 4, 5, 6].map(i => {
    const x = at(i, 0);
    return `<button class="wd${i === d ? ' on' : ''}${i === 0 ? ' today' : ''}" data-act="cal-day" data-v="${i}" aria-label="${cap(WD[x.getDay()])} ${dm(x)}">${WD_SHORT[x.getDay()]}<b>${x.getDate()}</b><i class="${eventsOn(i).length ? '' : 'none'}"></i></button>`;
  }).join('');
  const evs = eventsOn(d);
  const now = mins(hm(NOW));
  const rows = [];
  let placed = d !== 0;
  evs.forEach(e => {
    if (!placed && mins(e.s) > now) { rows.push(`<div class="now"><span>${hm(NOW)}</span><i></i></div>`); placed = true; }
    rows.push(evHTML(e, d));
  });
  if (!placed) rows.push(`<div class="now"><span>${hm(NOW)}</span><i></i></div>`);
  const title = d === 0 ? 'Dnes' : d === 1 ? 'Zajtra' : cap(WD[date.getDay()]);
  const slots = freeSlots(d);
  const c = current();
  const p = c && P(c.from);
  const canPropose = p && !p.bot && c.status !== 'draft';
  const hint = slots.length ? `<div class="ai-card"><span class="h">${SPARK}Navrhnúť termín</span><span>Voľno máš ${d === 0 ? 'dnes' : d === 1 ? 'zajtra' : WD_IN[date.getDay()]} ${slots.slice(0, 3).map(x => `<span class="nw">${slotText(x)}</span>`).join(', ')}.</span>${canPropose ? `<button class="btn" data-act="propose" data-tip="AI napíše ${esc(p.dat)} odpoveď s voľným termínom">${I.cal}Navrhnúť termín <small>${esc(first(c.from))}</small></button>` : '<span class="note">Otvor mail od kolegu a AI mu napíše návrh termínu.</span>'}</div>` : '';
  const later = [1, 2, 3, 4, 5, 6].filter(i => i !== d && eventsOn(i).length).slice(0, 3)
    .map(i => secHTML(i === 1 ? 'Zajtra' : `${cap(WD[at(i, 0).getDay()])} ${dm(at(i, 0))}`, eventsOn(i).map(e => miniRow(esc(e.t), e.s, `data-act="cal-day" data-v="${i}"`)).join(''))).join('');
  return `<div class="sbody"><div class="cal-h"><h3>${title}</h3><span>${cap(WD[date.getDay()])} ${dm(date)}</span></div>
<div class="week">${strip}</div>
<div class="agenda">${evs.length ? rows.join('') : '<div class="ev-empty">Žiadne stretnutia. Víkend bez kalendára.</div>'}</div>
${hint}
${later}</div>`;
}
function proposeTime() {
  const c = current();
  const p = c && P(c.from);
  if (!p || p.bot || c.status === 'draft') { toast('Najprv otvor mail od kolegu'); return; }
  const today = freeSlots(0)[0];
  const tomorrow = freeSlots(1)[0];
  const opts = [today && `dnes o ${fmtMin(today[0])}`, tomorrow && `zajtra o ${fmtMin(tomorrow[0])}`].filter(Boolean);
  startReply(c.id, `Ahoj ${first(c.from)}, poďme si na to sadnúť na pol hodinu. Hodí sa ti ${opts.join(' alebo ')}? Pozvánku pošlem hneď, ako potvrdíš.`);
}

function sendReply(c, text, acct = c.acct) {

  const prev = { status: c.status, unread: c.unread, draft: c.draft, sentAt: c.sentAt, sentText: c.sentText, sentTime: c.sentTime, snooze: c.snooze, sentAcct: c.sentAcct };

const Rewriter = {

    const base = text.trim() || (c.sugs && c.sugs[0][1]) || 'Ahoj, ďakujem za správu. Pozriem sa na to a ozvem sa.';
    if (/krat|struc|skrat|menej/.test(n)) return this.shorter(base);
    if (/formal|zdvoril|slusn|vyk/.test(n)) return this.formal(base, c);
    if (/termin|deadline|datum|kedy|do piat/.test(n)) return this.deadline(base);
    if (/priatel|neformal|uvolnen|mil/.test(n)) return this.casual(base);

  },
  shorter(t) {

  renderCtx() {

    $('#chat-ex').innerHTML = this.examples(c).map(x => `<button class="chipb" data-act="chat-ex" data-v="${esc(x)}">${esc(x)}</button>`).join('');
  },
  answerHTML(it, n) { return it.html.replace(/data-act="ask-primary"/g, `data-act="chat-primary" data-n="${n}"`) + `<div class="ans-foot">${esc(it.foot)}</div>`; },
  turnHTML(it, n) {
    const steps = it.steps.map((s, i) => `<div class="${!it.done && i === it.steps.length - 1 ? 'run' : ''}">${esc(s)}</div>`).join('');
    return `<div class="turn" id="turn-${n}"><div class="bub">${esc(it.q)}</div><div class="steps">${steps}</div><div class="tans">${it.done ? this.answerHTML(it, n) : ''}</div></div>`;
  },
  renderLog() {
    const el = $('#chat-log');
    el.innerHTML = '<div class="chat-day">Dnes</div>' + this.items.map((it, n) => this.turnHTML(it, n)).join('');
    el.scrollTop = el.scrollHeight;
  },
  focus(prefill = '') {
    openRight('ai');
    const i = $('#chat-q');

    i.focus();
  },
  ask(q) { openRight('ai'); this.submit(q); },
  submit(q) {
    q = (q || '').trim();
    if (!q) return;
    if (this.running) { toast('AI ešte odpovedá na predchádzajúcu otázku'); return; }
    const plan = Brain.plan(q, current());
    const it = { q, steps: [], done: false, html: '', primary: null, foot: '' };
    const n = this.items.push(it) - 1;
    this.running = true;
    $('#chat-q').value = '';
    const log = $('#chat-log');
    log.insertAdjacentHTML('beforeend', this.turnHTML(it, n));
    log.scrollTop = log.scrollHeight;
    const turn = () => $('#turn-' + n);
    const started = performance.now();
    let t = 120;
    plan.steps.forEach(s => {
      setTimeout(() => {
        it.steps.push(s);
        const el = turn();
        if (!el) return;
        $$('.steps .run', el).forEach(d => d.classList.remove('run'));
        $('.steps', el).insertAdjacentHTML('beforeend', `<div class="run">${esc(s)}</div>`);
        log.scrollTop = log.scrollHeight;
      }, t);
      t += 480 + Math.round(Math.random() * 260);
    });
    setTimeout(() => {
      const a = plan.answer();
      Object.assign(it, { html: a.html, primary: a.primary || null, done: true, foot: `${RUNNERS[S.settings.runner]} · domaci-server · ${((performance.now() - started) / 1000).toFixed(1).replace('.', ',')} s` });
      this.running = false;
      const el = turn();
      if (!el) return;
      $$('.steps .run', el).forEach(d => d.classList.remove('run'));
      $('.tans', el).innerHTML = this.answerHTML(it, n);
      log.scrollTop = log.scrollHeight;
    }, t);
  },
  key(e) {
    if (e.key === 'Escape') { e.preventDefault(); e.target.blur(); return; }
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const v = e.target.value.trim();
    if (v) { this.submit(v); return; }
    const last = this.items[this.items.length - 1];
    if (last && last.done && last.primary) last.primary();
  },
};

const Layer = {
  stack: [],
  top() { return this.stack[this.stack.length - 1]; },
  make(cls, html) {
    const el = document.createElement('div');
    el.className = 'ov ' + cls;
    el.innerHTML = html;
    el.addEventListener('mousedown', e => { if (e.target === el) this.top()?.close(); });
    $('#layer').append(el);
    return el;
  },
  push(o) { this.stack.push(o); Tip.hide(); },
  remove(o) {
    const i = this.stack.indexOf(o);
    if (i >= 0) this.stack.splice(i, 1);
    o.el.remove();
  },
  closeAll() { [...this.stack].reverse().forEach(o => o.close()); },
};

const Confirm = {

    const finish = yes => {
      Layer.remove(o);
      this.cur = null;
      const fn = yes ? onOk : onCancel;
      if (fn) fn();
    };
    const o = {
      el,
      key: e => {
        if (e.key === 'Escape') { e.preventDefault(); finish(false); return; }
        if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      },
      close: () => finish(false),
    };
    this.cur = { yes: () => finish(true), no: () => finish(false) };
    Layer.push(o);
  },
};

  all: 'Zvyšok počká: retro je v pondelok, podklady k DPH stačia do 25. 11. a v Osobnom účte nič nehorí.',
  efa: 'Zvyšok počká: retro je v pondelok a odhady pre Q1 stačia do piatka.',
