appId: sk.relay.desktop
productName: Relay
copyright: Copyright © 2026 Relay
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - '!node_modules/better-sqlite3/{build,deps,src}/**'
  - '!node_modules/better-sqlite3/binding.gyp'
  - '!node_modules/better-sqlite3/prebuilds/!(${platform}-${arch}).node'
extraResources:
  - from: ../../packages/store-sqlite/drizzle
    to: drizzle
    filter:
      - '**/*'
asarUnpack:
  - '**/*.node'
  - node_modules/better-sqlite3/**
npmRebuild: true
electronFuses:
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
artifactName: relay-${version}-${arch}-${os}.${ext}
mac:
  category: public.app-category.productivity
  icon: resources/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: false
  darkModeSupport: true
  extendInfo:
    ElectronSquirrelPreventDowngrades: true
dmg:
  sign: true
  writeUpdateInfo: false
  title: ${productName} ${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
linux:
  category: Office
  icon: resources/icon.png
  executableName: relay
  synopsis: AI-native e-mailový klient
  description: Relay je e-mailový klient s AI, ktorý beží lokálne alebo so synchronizačným serverom.
  maintainer: Relay <info@codevo.app>
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  desktop:
    entry:
      StartupWMClass: Relay
publish:
  provider: github
  owner: MatusMockor
  repo: relay
  releaseType: release
