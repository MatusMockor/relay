name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-lint-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-typecheck-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-typecheck-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm turbo run test --concurrency=2
          --filter='!@relay/desktop'
          --filter='!@relay/server'
          --filter='!@relay/mail-core'

  test-mail-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GREENMAIL_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start GreenMail
        run: docker compose -f docker-compose.test.yml up -d --wait greenmail
      - run: pnpm --filter @relay/mail-core test
      - name: Dump GreenMail logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --tail=100 greenmail

  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      TEST_DATABASE_URL: postgres://relay:relay@127.0.0.1:5433/relay_test
      GREENMAIL_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start test infrastructure
        run: docker compose -f docker-compose.test.yml up -d --wait
      - run: pnpm --filter @relay/server exec vitest run --shard=${{ matrix.shard }}/2
      - name: Dump infrastructure logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --tail=100

  test-desktop-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm --filter @relay/desktop exec vitest run src/renderer
          --shard=${{ matrix.shard }}/3

  test-desktop-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgres://relay:relay@127.0.0.1:5433/relay_test
      GREENMAIL_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start test infrastructure
        run: docker compose -f docker-compose.test.yml up -d --wait
      - run: pnpm --filter @relay/desktop exec vitest run --exclude 'src/renderer/**'
      - name: Dump infrastructure logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --tail=100

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - lint
      - typecheck
      - test-packages
      - test-mail-core
      - test-server
      - test-desktop-renderer
      - test-desktop-main
    steps:
      - name: Verify all checks passed
        run: |
          for result in \
            "${{ needs.lint.result }}" \
            "${{ needs.typecheck.result }}" \
            "${{ needs.test-packages.result }}" \
            "${{ needs.test-mail-core.result }}" \
            "${{ needs.test-server.result }}" \
            "${{ needs.test-desktop-renderer.result }}" \
            "${{ needs.test-desktop-main.result }}"; do
            if [ "$result" != "success" ]; then
              echo "Upstream job did not succeed: $result"
              exit 1
            fi
          done
