name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      TEST_DATABASE_URL: postgres://relay:relay@127.0.0.1:5433/relay_test
      GREENMAIL_HOST: 127.0.0.1
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      greenmail:
        image: greenmail/standalone:2.1.15
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.all
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.auth.disabled=false
            -Dgreenmail.users.login=email
            -Dgreenmail.users=relay:relay-secret@relay.test
        ports:
          - 3025:3025
          - 3143:3143
          - 3465:3465
          - 3993:3993
          - 8086:8080
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3143'"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Raise test Postgres connection limit
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U relay -d relay_test -c "ALTER SYSTEM SET max_connections = 400"
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U relay -d relay_test; do sleep 1; done
          docker exec ${{ job.services.postgres.id }} psql -U relay -d relay_test -tAc "SHOW max_connections"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
