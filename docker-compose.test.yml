name: relay-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay_test
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    command:
      [
        'postgres',
        '-c',
        'fsync=off',
        '-c',
        'synchronous_commit=off',
        '-c',
        'full_page_writes=off',
        '-c',
        'max_connections=400',
      ]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relay -d relay_test']
      interval: 1s
      timeout: 3s
      retries: 30

  greenmail:
    image: greenmail/standalone:2.1.15
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled=false
        -Dgreenmail.users.login=email
        -Dgreenmail.users=relay:relay-secret@relay.test
    ports:
      - '127.0.0.1:3025:3025'
      - '127.0.0.1:3143:3143'
      - '127.0.0.1:3465:3465'
      - '127.0.0.1:3993:3993'
      - '127.0.0.1:8086:8080'
    healthcheck:
      test:
        ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/3143 && exec 4<>/dev/tcp/127.0.0.1/8080']
      interval: 2s
      timeout: 3s
      retries: 30
